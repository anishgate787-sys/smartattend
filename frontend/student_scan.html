<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script id="tailwind-config">tailwind.config = { theme: { extend: { colors: { "primary": "#00236f", "primary-container": "#1e3a8a", "on-primary": "#ffffff", "surface": "#f8f9ff", "on-surface": "#0b1c30", "on-surface-variant": "#444651", "error": "#ba1a1a", "tertiary-container": "#004942" } } } };</script>
</head>
<body class="bg-black font-sans text-white min-h-screen flex flex-col">

<div class="flex items-center justify-between px-4 py-4">
<button class="flex items-center gap-1 text-sm" onclick="cleanupAndGo('student_home.html')">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>Cancel
</button>
<span class="text-sm font-medium">Scan Attendance QR</span>
<span class="w-16"></span>
</div>

<div class="flex-1 relative flex items-center justify-center overflow-hidden">
<video autoplay class="absolute inset-0 w-full h-full object-cover" id="video" muted playsinline></video>
<canvas class="hidden" id="canvas"></canvas>

<!-- Scan frame overlay -->
<div class="relative z-10 w-64 h-64 border-4 border-white/70 rounded-2xl" id="scanFrame">
<div class="absolute -top-1 -left-1 w-8 h-8 border-t-4 border-l-4 border-tertiary-container rounded-tl-2xl"></div>
<div class="absolute -top-1 -right-1 w-8 h-8 border-t-4 border-r-4 border-tertiary-container rounded-tr-2xl"></div>
<div class="absolute -bottom-1 -left-1 w-8 h-8 border-b-4 border-l-4 border-tertiary-container rounded-bl-2xl"></div>
<div class="absolute -bottom-1 -right-1 w-8 h-8 border-b-4 border-r-4 border-tertiary-container rounded-br-2xl"></div>
</div>

<p class="absolute bottom-10 z-10 text-sm text-white/90 px-6 text-center" id="instruction">Align QR code within the frame</p>
</div>

<!-- Result overlay -->
<div class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-20 px-6" id="resultOverlay">
<span class="material-symbols-outlined text-[72px] mb-4" id="resultIcon">check_circle</span>
<h2 class="text-xl font-semibold mb-2" id="resultTitle"></h2>
<p class="text-sm text-white/70 text-center mb-8" id="resultMessage"></p>
<button class="w-full max-w-xs h-11 bg-primary-container text-on-primary rounded-lg text-sm font-semibold" onclick="cleanupAndGo('student_home.html')">OK</button>
</div>

<script src="config.js"></script><script src="api.js"></script>
<script>
  const scanParams = new URLSearchParams(window.location.search);
  const preloadedPayload = scanParams.get('payload');
  const user = requireAuth('student', preloadedPayload ? `student_scan.html?payload=${encodeURIComponent(preloadedPayload)}` : 'student_scan.html');
  let stream = null;
  let scanning = true;
  let scanLoopHandle = null;

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const video = document.getElementById('video');
      video.srcObject = stream;
      video.setAttribute('playsinline', true);
      requestAnimationFrame(tick);
    } catch (err) {
      document.getElementById('instruction').innerText = 'Camera access denied. Enable camera permission to scan.';
    }
  }

  function tick() {
    if (!scanning) return;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.height = video.videoHeight;
      canvas.width = video.videoWidth;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) {
        scanning = false;
        handleScan(code.data);
        return;
      }
    }
    scanLoopHandle = requestAnimationFrame(tick);
  }

  async function handleScan(qrPayload) {
    scanning = false;
    if (scanLoopHandle) cancelAnimationFrame(scanLoopHandle);
    if (stream) stream.getTracks().forEach(t => t.stop());
    document.getElementById('instruction').innerText = 'Submitting attendance...';
    try {
      await apiRequest('/attendance/mark', { method: 'POST', body: JSON.stringify({ qr_payload: qrPayload }) });
      showResult(true, 'Attendance Marked!', 'You have been marked present for this session.');
    } catch (err) {
      showResult(false, 'Could Not Mark Attendance', err.message);
    }
  }

  function showResult(success, title, message) {
    document.getElementById('resultOverlay').classList.remove('hidden');
    document.getElementById('resultOverlay').classList.add('flex');
    document.getElementById('resultIcon').innerText = success ? 'check_circle' : 'cancel';
    document.getElementById('resultIcon').className = success
      ? 'material-symbols-outlined text-[72px] mb-4 text-tertiary-container'
      : 'material-symbols-outlined text-[72px] mb-4 text-red-400';
    document.getElementById('resultTitle').innerText = title;
    document.getElementById('resultMessage').innerText = message;
  }

  function cleanupAndGo(url) {
    scanning = false;
    if (scanLoopHandle) cancelAnimationFrame(scanLoopHandle);
    if (stream) stream.getTracks().forEach(t => t.stop());
    window.location.href = url;
  }

  if (user) {
    // Camera and Lens open this page with the token in the URL. Submit it
    // directly; otherwise start the in-app camera scanner.
    if (preloadedPayload) handleScan(preloadedPayload);
    else startCamera();
  }
</script>
</body></html>
