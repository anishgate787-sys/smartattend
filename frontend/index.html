<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary-fixed-variant": "#005049", "on-error": "#ffffff", "on-background": "#0b1c30", "outline-variant": "#c5c5d3", "on-surface": "#0b1c30", "on-primary-container": "#90a8ff", "secondary-fixed-dim": "#c3c0ff", "secondary-fixed": "#e3dfff", "background": "#f8f9ff", "on-primary": "#ffffff", "on-secondary": "#ffffff", "tertiary-fixed-dim": "#6bd8cb", "inverse-on-surface": "#eaf1ff", "inverse-surface": "#213145", "primary-container": "#1e3a8a", "tertiary": "#00312c", "outline": "#757682", "on-surface-variant": "#444651", "tertiary-fixed": "#89f5e7", "on-tertiary-container": "#4ebdb0", "on-primary-fixed-variant": "#264191", "surface-variant": "#d3e4fe", "primary-fixed": "#dce1ff", "inverse-primary": "#b6c4ff", "tertiary-container": "#004942", "on-secondary-fixed": "#100069", "surface-dim": "#cbdbf5", "on-secondary-container": "#fffbff", "on-error-container": "#93000a", "surface-bright": "#f8f9ff", "surface": "#f8f9ff", "error": "#ba1a1a", "error-container": "#ffdad6", "surface-container-lowest": "#ffffff", "on-tertiary-fixed": "#00201d", "primary-fixed-dim": "#b6c4ff", "secondary-container": "#6860ef", "secondary": "#4e45d5", "surface-container": "#e5eeff", "primary": "#00236f", "on-primary-fixed": "#00164e", "on-secondary-fixed-variant": "#372abf", "on-tertiary": "#ffffff", "surface-container-low": "eff4ff", "surface-tint": "#4059aa", "surface-container-high": "#dce9ff", "surface-container-highest": "#d3e4fe" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" } } } };</script>
<style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;}}::-webkit-scrollbar{display:none;}</style></head>
<body class="bg-surface font-sans text-on-surface flex flex-col min-h-screen">
<main class="flex flex-col relative w-full min-h-screen">
<div class="flex flex-col w-full px-4 py-6 max-w-md mx-auto relative">

<div class="flex flex-col items-center text-center mb-6">
<div class="w-14 h-14 rounded-xl bg-primary-container flex items-center justify-center shadow-md mb-2">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
</div>
<div class="flex items-center gap-1.5">
<span class="text-xl text-primary tracking-tight font-bold">SmartAttend</span>
</div>
<p class="text-sm text-on-surface-variant mt-1">QR-based attendance, without the proxy problem</p>
</div>

<div class="w-full bg-surface-container-lowest rounded-xl shadow-md p-4 relative flex flex-col">

<div class="mb-4" id="formHeading">
<h1 class="text-2xl text-on-surface font-semibold tracking-tight" id="formTitle">Welcome back</h1>
<p class="text-sm text-on-surface-variant mt-0.5" id="formSubtitle">Sign in to access your classes and attendance</p>
</div>

<!-- Role Switcher -->
<div class="relative bg-surface-container-high p-1 rounded-lg flex items-center mb-4 select-none">
<div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-lg shadow-sm transition-all duration-300 ease-out" id="roleIndicator"></div>
<button class="relative z-10 flex-1 py-2 flex items-center justify-center gap-1.5 text-sm text-primary font-semibold transition-colors duration-200" id="studentTab" onclick="switchRole('student')" type="button">
<span class="material-symbols-outlined text-[18px]">school</span><span>Student</span>
</button>
<button class="relative z-10 flex-1 py-2 flex items-center justify-center gap-1.5 text-sm text-on-surface-variant font-medium transition-colors duration-200" id="facultyTab" onclick="switchRole('faculty')" type="button">
<span class="material-symbols-outlined text-[18px]">badge</span><span>Faculty</span>
</button>
</div>

<!-- Error banner -->
<div class="hidden mb-3 px-3 py-2 rounded-lg bg-error-container text-on-error-container text-sm flex items-start gap-2" id="errorBanner">
<span class="material-symbols-outlined text-[18px]">error</span>
<span id="errorText"></span>
</div>

<form class="flex flex-col gap-4" id="authForm">
<!-- Name field, only shown on signup -->
<div class="hidden flex-col gap-1.5 text-left" id="nameField">
<label class="text-xs text-on-surface font-medium" for="nameInput">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none">person</span>
<input class="w-full h-11 pl-10 pr-3 rounded-lg bg-surface-container-low text-on-surface text-sm placeholder:text-outline outline-none focus:shadow-[0_0_0_2px] focus:shadow-primary-container" id="nameInput" placeholder="Your full name" type="text"/>
</div>

<div class="hidden grid grid-cols-2 gap-3 text-left" id="studentProfileFields">
<div class="flex flex-col gap-1.5"><label class="text-xs text-on-surface font-medium" for="rollInput">Roll number</label><input class="w-full h-11 px-3 rounded-lg bg-surface-container-low text-sm outline-none focus:shadow-[0_0_0_2px] focus:shadow-primary-container" id="rollInput" placeholder="24CS042" type="text"/></div>
<div class="flex flex-col gap-1.5"><label class="text-xs text-on-surface font-medium" for="departmentInput">Department</label><input class="w-full h-11 px-3 rounded-lg bg-surface-container-low text-sm outline-none focus:shadow-[0_0_0_2px] focus:shadow-primary-container" id="departmentInput" placeholder="Computer Science" type="text"/></div>
<div class="flex flex-col gap-1.5"><label class="text-xs text-on-surface font-medium" for="yearInput">Year</label><input class="w-full h-11 px-3 rounded-lg bg-surface-container-low text-sm outline-none focus:shadow-[0_0_0_2px] focus:shadow-primary-container" id="yearInput" placeholder="2nd year" type="text"/></div>
<div class="flex flex-col gap-1.5"><label class="text-xs text-on-surface font-medium" for="sectionInput">Section</label><input class="w-full h-11 px-3 rounded-lg bg-surface-container-low text-sm outline-none focus:shadow-[0_0_0_2px] focus:shadow-primary-container" id="sectionInput" placeholder="A" type="text"/></div>
</div>
</div>

<div class="flex flex-col gap-1.5 text-left">
<label class="text-xs text-on-surface font-medium" for="emailInput">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none">mail</span>
<input class="w-full h-11 pl-10 pr-3 rounded-lg bg-surface-container-low text-on-surface text-sm placeholder:text-outline outline-none focus:shadow-[0_0_0_2px] focus:shadow-primary-container" id="emailInput" placeholder="you@college.edu" required="" type="email"/>
</div>
</div>

<div class="flex flex-col gap-1.5 text-left">
<label class="text-xs text-on-surface font-medium" for="passwordInput">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px] pointer-events-none">lock</span>
<input class="w-full h-11 pl-10 pr-10 rounded-lg bg-surface-container-low text-on-surface text-sm placeholder:text-outline outline-none focus:shadow-[0_0_0_2px] focus:shadow-primary-container" id="passwordInput" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2 p-1.5 text-on-surface-variant rounded-full flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>

<button class="w-full h-11 mt-1 bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary text-sm font-semibold rounded-lg flex items-center justify-center gap-2 shadow-sm transition-all duration-150" id="submitBtn" type="submit">
<span id="submitBtnText">Sign in to Dashboard</span>
<span class="material-symbols-outlined text-[18px]" id="btnArrow">arrow_forward</span>
</button>
</form>

<div class="text-center mt-4 flex flex-col gap-2">
<p class="text-sm text-on-surface-variant" id="switchModeText">
      Don't have an account?
      <a class="text-sm text-primary font-semibold hover:underline ml-1" href="#" id="switchModeLink" onclick="toggleMode(event)">Sign up</a>
</p>
</div>
</div>

<!-- Toast -->
<div class="fixed bottom-6 left-4 right-4 max-w-sm mx-auto bg-inverse-surface text-inverse-on-surface px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50" id="toast">
<span class="material-symbols-outlined text-[20px] text-tertiary-fixed-dim" id="toastIcon">check_circle</span>
<span class="text-sm flex-1" id="toastMsg"></span>
</div>
</div>
</main>

<script src="config.js"></script><script src="api.js"></script>
<script>
  let currentRole = 'student';
  let isSignupMode = false;

  function switchRole(role) {
    currentRole = role;
    document.getElementById('studentProfileFields').classList.toggle('hidden', !isSignupMode || role !== 'student');
    const indicator = document.getElementById('roleIndicator');
    const studentBtn = document.getElementById('studentTab');
    const facultyBtn = document.getElementById('facultyTab');

    if (role === 'student') {
      indicator.style.transform = 'translateX(0%)';
      studentBtn.classList.replace('text-on-surface-variant', 'text-primary');
      facultyBtn.classList.replace('text-primary', 'text-on-surface-variant');
    } else {
      indicator.style.transform = 'translateX(calc(100% + 4px))';
      facultyBtn.classList.replace('text-on-surface-variant', 'text-primary');
      studentBtn.classList.replace('text-primary', 'text-on-surface-variant');
    }
  }

  function togglePasswordVisibility() {
    const field = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    if (field.type === 'password') { field.type = 'text'; icon.innerText = 'visibility_off'; }
    else { field.type = 'password'; icon.innerText = 'visibility'; }
  }

  function toggleMode(e) {
    e.preventDefault();
    isSignupMode = !isSignupMode;
    document.getElementById('nameField').classList.toggle('hidden', !isSignupMode);
    document.getElementById('nameField').classList.toggle('flex', isSignupMode);
    document.getElementById('studentProfileFields').classList.toggle('hidden', !isSignupMode || currentRole !== 'student');
    document.getElementById('formTitle').innerText = isSignupMode ? 'Create your account' : 'Welcome back';
    document.getElementById('formSubtitle').innerText = isSignupMode
      ? 'Sign up to start tracking attendance'
      : 'Sign in to access your classes and attendance';
    document.getElementById('submitBtnText').innerText = isSignupMode ? 'Create Account' : 'Sign in to Dashboard';
    document.getElementById('switchModeText').innerHTML = isSignupMode
      ? `Already have an account? <a class="text-sm text-primary font-semibold hover:underline ml-1" href="#" id="switchModeLink" onclick="toggleMode(event)">Sign in</a>`
      : `Don't have an account? <a class="text-sm text-primary font-semibold hover:underline ml-1" href="#" id="switchModeLink" onclick="toggleMode(event)">Sign up</a>`;
    hideError();
  }

  function showError(msg) {
    document.getElementById('errorBanner').classList.remove('hidden');
    document.getElementById('errorText').innerText = msg;
  }
  function hideError() {
    document.getElementById('errorBanner').classList.add('hidden');
  }

  function showToast(message, iconName = 'check_circle') {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').innerText = message;
    document.getElementById('toastIcon').innerText = iconName;
    toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
    toast.classList.add('opacity-100', 'translate-y-0');
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.remove('opacity-100', 'translate-y-0');
    }, 2800);
  }

  // If already logged in, skip straight to the right dashboard.
  (function redirectIfLoggedIn() {
    const user = getUser();
    if (user && getToken()) {
      window.location.href = user.role === 'faculty' ? 'faculty_dashboard.html' : 'student_home.html';
    }
  })();

  document.getElementById('authForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    hideError();
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const name = document.getElementById('nameInput').value.trim();
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('submitBtnText');
    const originalText = btnText.innerText;

    if (isSignupMode && !name) { showError('Please enter your name'); return; }
    if (!email || !password) { showError('Please fill in all fields'); return; }

    btn.disabled = true;
    btnText.innerText = isSignupMode ? 'Creating account...' : 'Signing in...';

    try {
      let data;
      if (isSignupMode) {
        data = await apiRequest('/auth/signup', {
          method: 'POST',
          body: JSON.stringify({ name, email, password, role: currentRole, device_id: getDeviceId(),
            roll_number: document.getElementById('rollInput').value.trim(),
            department: document.getElementById('departmentInput').value.trim(),
            year: document.getElementById('yearInput').value.trim(),
            section: document.getElementById('sectionInput').value.trim() })
        });
      } else {
        data = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password, device_id: getDeviceId() })
        });
      }
      saveSession(data);
      showToast(`Welcome, ${data.name}!`);
      setTimeout(() => {
        window.location.href = data.role === 'faculty' ? 'faculty_dashboard.html' : 'student_home.html';
      }, 600);
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btnText.innerText = originalText;
    }
  });
</script>
</body></html>
