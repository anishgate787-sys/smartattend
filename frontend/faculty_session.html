<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config = { theme: { extend: { colors: { "primary": "#00236f", "primary-container": "#1e3a8a", "on-primary": "#ffffff", "surface": "#f8f9ff", "surface-container-lowest": "#ffffff", "surface-container-low": "#eff4ff", "surface-container": "#e5eeff", "on-surface": "#0b1c30", "on-surface-variant": "#444651", "error": "#ba1a1a", "tertiary-container": "#004942" } } } };</script>
</head>
<body class="bg-surface font-sans text-on-surface min-h-screen flex flex-col items-center px-4 py-8">

<div class="w-full max-w-sm flex flex-col items-center">
<button class="self-start text-sm text-on-surface-variant flex items-center gap-1 mb-4" onclick="window.location.href='faculty_dashboard.html'">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>Back to dashboard
</button>

<h1 class="text-lg font-semibold mb-1">Live Attendance Session</h1>
<p class="text-sm text-on-surface-variant mb-6">Students scan this code to mark present</p>

<div class="bg-surface-container-lowest rounded-2xl shadow-md p-6 flex flex-col items-center w-full">
<div class="w-56 h-56 flex items-center justify-center bg-surface-container-low rounded-xl mb-4" id="qrContainer"></div>
<p class="hidden text-xs text-error text-center mb-3" id="qrNetworkWarning"></p>
<p class="text-[11px] text-on-surface-variant text-center break-all" id="qrLink"></p>

<div class="flex items-center gap-2 mb-1">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary-container"></span>
</span>
<span class="text-xs text-on-surface-variant" id="refreshLabel">Refreshing in 15s</span>
</div>

<div class="bg-surface-container-lowest rounded-2xl shadow-sm p-5 w-full mt-4">
<div class="flex items-center justify-between mb-3"><div><h2 class="text-sm font-semibold">Live class list</h2><p class="text-xs text-on-surface-variant">Present and absent students update as they scan.</p></div><span class="material-symbols-outlined text-primary-container">groups</span></div>
<div class="flex gap-2 text-xs font-semibold mb-3"><span class="px-2 py-1 rounded-full bg-tertiary-container text-white" id="presentLabel">Present 0</span><span class="px-2 py-1 rounded-full bg-error-container text-error" id="absentLabel">Absent 0</span></div>
<div class="max-h-52 overflow-auto flex flex-col gap-2" id="liveRoster"></div>
</div>

<div class="text-2xl font-bold mt-4" id="markedCount">0 / 0</div>
<div class="text-xs text-on-surface-variant mb-6">students marked present</div>

<button class="w-full h-11 bg-error text-white rounded-lg text-sm font-semibold" onclick="endSession()">End Session</button>
</div>

<p class="hidden text-error text-sm mt-4 text-center" id="errorMsg"></p>
</div>

<script src="config.js"></script><script src="api.js"></script>
<script>
  const user = requireAuth('faculty');
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  if (!sessionId) window.location.href = 'faculty_dashboard.html';

  let qrCodeInstance = null;
  let countdownInterval = null;
  let refreshInterval = null;
  let ended = false;

  function renderQR(payload) {
    const container = document.getElementById('qrContainer');
    container.innerHTML = '';
    const configuredValue = (window.SMARTATTEND_PUBLIC_URL || '').trim();
    let configuredOrigin = window.location.origin;
    try {
      const candidate = new URL(configuredValue || window.location.origin);
      const invalidHost = ['0.0.0.0', 'localhost', '127.0.0.1'].includes(candidate.hostname);
      if (!invalidHost && ['http:', 'https:'].includes(candidate.protocol)) {
        configuredOrigin = candidate.origin;
      }
    } catch (err) {
      // A malformed optional override must not break QR generation on Render.
      configuredOrigin = window.location.origin;
    }
    configuredOrigin = configuredOrigin.replace(/\/$/, '');
    const attendanceUrl = `${configuredOrigin}/student_scan.html?payload=${encodeURIComponent(payload)}`;
    const image = document.createElement('img');
    image.src = `/qr.png?data=${encodeURIComponent(attendanceUrl)}`;
    image.alt = 'Attendance QR code';
    image.width = 220;
    image.height = 220;
    image.className = 'bg-white';
    image.onerror = () => {
      document.getElementById('errorMsg').innerText = 'QR image could not be generated. Refresh the page and try again.';
      document.getElementById('errorMsg').classList.remove('hidden');
    };
    container.appendChild(image);
    document.getElementById('qrLink').innerText = attendanceUrl;

    const host = new URL(configuredOrigin).hostname;
    const isLocalOnly = ['localhost', '127.0.0.1', '0.0.0.0'].includes(host) || host.endsWith('.local');
    const warning = document.getElementById('qrNetworkWarning');
    if (isLocalOnly) {
      warning.innerText = 'This QR uses a local address. Set SMARTATTEND_PUBLIC_URL to your computer LAN IP or public HTTPS URL before scanning with a phone.';
      warning.classList.remove('hidden');
    } else {
      warning.classList.add('hidden');
    }
  }

  async function fetchAndShowToken() {
    if (ended) return;
    try {
      const data = await apiRequest(`/session/${sessionId}/token`);
      renderQR(data.qr_payload);
      document.getElementById('markedCount').innerText = `${data.marked_count} / ${data.enrolled_count}`;
      startCountdown(data.expires_in);
      loadLiveRoster();
    } catch (err) {
      document.getElementById('errorMsg').innerText = err.message;
      document.getElementById('errorMsg').classList.remove('hidden');
      if (err.message.toLowerCase().includes('ended')) {
        stopTimers();
      }
    }
  }

  async function loadLiveRoster() {
    try {
      const report = await apiRequest(`/session/${sessionId}/attendance`);
      const roster = document.getElementById('liveRoster');
      roster.innerHTML = '';
      const present = report.students.filter(s => s.present).length;
      document.getElementById('presentLabel').innerText = `Present ${present}`;
      document.getElementById('absentLabel').innerText = `Absent ${report.students.length - present}`;
      report.students.forEach(student => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between text-xs border-b border-surface-container pb-2';
        row.innerHTML = `<span class="font-medium">${escapeHtml(student.name)} <span class="text-on-surface-variant">${escapeHtml(student.roll_number || '')}</span></span><span class="font-semibold ${student.present ? 'text-tertiary-container' : 'text-error'}">${student.status}</span>`;
        roster.appendChild(row);
      });
    } catch (err) { /* The QR loop remains usable if the roster request is temporarily unavailable. */ }
  }

  function startCountdown(seconds) {
    clearInterval(countdownInterval);
    let remaining = seconds;
    document.getElementById('refreshLabel').innerText = `Refreshing in ${remaining}s`;
    countdownInterval = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) { clearInterval(countdownInterval); return; }
      document.getElementById('refreshLabel').innerText = `Refreshing in ${remaining}s`;
    }, 1000);
  }

  function stopTimers() {
    ended = true;
    clearInterval(countdownInterval);
    clearInterval(refreshInterval);
  }

  async function endSession() {
    try {
      await apiRequest(`/session/${sessionId}/end`, { method: 'POST' });
      stopTimers();
      alert('Session ended.');
      window.location.href = 'faculty_dashboard.html';
    } catch (err) {
      alert('Could not end session: ' + err.message);
    }
  }

  if (user) {
    fetchAndShowToken();
    // Refresh before expiry so the displayed code never has a dead gap.
    refreshInterval = setInterval(fetchAndShowToken, 13000);
    setInterval(loadLiveRoster, 4000);
  }
</script>
</body></html>
